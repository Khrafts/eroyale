[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=src/vendor/openzeppelin/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
lint_on_build = false
